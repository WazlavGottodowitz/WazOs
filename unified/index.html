<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WazOS Unified Perchance Generator</title>
  <style>
    :root {
      --bg: #040c06;
      --bg-2: #0a180d;
      --panel: rgba(10, 22, 13, 0.94);
      --panel-2: rgba(15, 28, 18, 0.96);
      --line: #1b5a3f;
      --line-soft: rgba(43, 118, 80, 0.5);
      --text: #ccffd9;
      --muted: #9cd9ac;
      --accent: #70ff9a;
      --accent-2: #9cf6ff;
      --warning: #ffd166;
      --danger: #ff7d7d;
      --shadow: rgba(80, 255, 150, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(71, 255, 130, 0.09), transparent 35%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 24px;
    }

    .shell {
      width: min(1200px, 100%);
      background: rgba(6, 14, 9, 0.9);
      border: 1px solid var(--line);
      box-shadow: 0 0 32px var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 17, 13, 0.95);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.9rem;
      color: var(--accent);
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }

    .mode-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mode-btn, button, select, input, textarea {
      font: inherit;
    }

    .mode-btn, button {
      border: 1px solid var(--line);
      background: rgba(17, 27, 19, 0.9);
      color: var(--text);
      padding: 9px 12px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .mode-btn:hover, button:hover {
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(112, 255, 154, 0.18);
      transform: translateY(-1px);
    }

    .mode-btn.active {
      background: rgba(112, 255, 154, 0.12);
      border-color: var(--accent);
      color: #eafff0;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      min-height: 760px;
    }

    .sidebar, .main-panel {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(10, 18, 12, 0.98), rgba(7, 14, 10, 0.98));
    }

    .panel-box {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input, textarea, select {
      width: 100%;
      background: rgba(6, 15, 8, 0.96);
      border: 1px solid var(--line-soft);
      color: var(--text);
      padding: 10px 12px;
      resize: vertical;
    }

    textarea {
      min-height: 110px;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line-soft);
      background: rgba(112, 255, 154, 0.05);
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary {
      background: rgba(112, 255, 154, 0.12);
      border-color: var(--accent);
      color: #eafef1;
    }

    .ghost {
      background: rgba(156, 246, 255, 0.04);
      border-color: var(--line-soft);
    }

    .preview-shell {
      position: relative;
      border: 1px solid var(--line-soft);
      background: linear-gradient(135deg, rgba(6, 17, 9, 0.94), rgba(14, 20, 14, 0.94));
      min-height: 330px;
      overflow: hidden;
    }

    .preview-shell img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 330px;
      object-fit: cover;
      background: linear-gradient(135deg, #09150d, #102214);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .pill {
      padding: 6px 10px;
      border: 1px solid var(--line-soft);
      background: rgba(112, 255, 154, 0.06);
      color: var(--text);
    }

    .pill.loading {
      border-color: var(--warning);
      color: var(--warning);
    }

    .main-panel {
      background: rgba(7, 15, 9, 0.9);
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      background: transparent;
      border: 1px solid var(--line-soft);
      color: var(--muted);
    }

    .tab.active {
      background: rgba(112, 255, 154, 0.08);
      border-color: var(--accent);
      color: var(--text);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .tab-content.active {
      display: flex;
    }

    .log {
      min-height: 170px;
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--line-soft);
      background: rgba(3, 9, 5, 0.96);
      color: var(--muted);
      padding: 12px;
      font-family: "Consolas", "SFMono-Regular", monospace;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .output-box {
      min-height: 120px;
      background: rgba(4, 11, 6, 0.96);
      border: 1px solid var(--line-soft);
      padding: 12px;
      color: var(--text);
      white-space: pre-wrap;
      font-family: "Consolas", "SFMono-Regular", monospace;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }

    .metric {
      border: 1px solid var(--line-soft);
      background: rgba(14, 21, 16, 0.9);
      padding: 12px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>WazOS // Unified Perchance Generator</span>
      </div>
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="biped">Biped</button>
        <button class="mode-btn" data-mode="lattice">Lattice</button>
        <button class="mode-btn" data-mode="portrait">Portrait</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="panel-box">
          <div class="field">
            <label for="subject">Subject</label>
            <textarea id="subject">cybernetic fox with glowing joints, heroic pose, biomechanical anatomy, cinematic lighting</textarea>
          </div>

          <div class="field">
            <label for="style">Style</label>
            <textarea id="style">ultra detailed, clean silhouette, neon green accents, anime influence, industrial sci-fi</textarea>
          </div>

          <div class="inline-grid">
            <div class="field">
              <label for="mode">Rig Mode</label>
              <select id="mode">
                <option value="biped">Biped</option>
                <option value="lattice">Lattice</option>
                <option value="portrait">Portrait</option>
                <option value="robot">Robot</option>
              </select>
            </div>
            <div class="field">
              <label for="size">Resolution</label>
              <select id="size">
                <option value="768x768">768x768</option>
                <option value="1024x1024">1024x1024</option>
                <option value="1024x768">1024x768</option>
                <option value="1536x1024">1536x1024</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="negative">Negative prompt</label>
            <input id="negative" value="blurry, low quality, deformed anatomy, watermark, text, duplicated limbs, noisy background" />
          </div>

          <div class="chip-row">
            <button class="chip" data-template="cybernetic skull with neon green tubes, cinematic lighting">Cyber skull</button>
            <button class="chip" data-template="biomechanical fox with luminous joints, heroic pose">Biomech fox</button>
            <button class="chip" data-template="steampunk android with brass organs, dramatic multi-angle composition">Steampunk bot</button>
            <button class="chip" data-template="gothic guardian with chrome armor and glowing veins">Guardian</button>
          </div>

          <div class="button-row">
            <button id="generate" class="primary">Generate</button>
            <button id="surprise" class="ghost">Surprise me</button>
          </div>
        </div>

        <div class="panel-box">
          <div class="preview-shell">
            <img id="preview" alt="Generated preview" src="" />
          </div>

          <div class="status-row">
            <span id="status-text">Ready</span>
            <span id="status-pill" class="pill">Pipeline: online</span>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <div class="tabs">
          <button class="tab active" data-tab="studio">Studio</button>
          <button class="tab" data-tab="log">Execution Log</button>
          <button class="tab" data-tab="meta">Meta</button>
        </div>

        <div class="tab-content active" data-tab="studio">
          <div class="panel-box">
            <div class="field">
              <label>Final prompt</label>
              <div id="final-prompt" class="output-box"></div>
            </div>
          </div>

          <div class="metrics">
            <div class="metric">
              <div class="metric-label">Anatomy</div>
              <div class="metric-value" id="metric-anatomy">stable</div>
            </div>
            <div class="metric">
              <div class="metric-label">Rig</div>
              <div class="metric-value" id="metric-rig">biped</div>
            </div>
            <div class="metric">
              <div class="metric-label">Seed</div>
              <div class="metric-value" id="metric-seed">--</div>
            </div>
          </div>
        </div>

        <div class="tab-content" data-tab="log">
          <div id="log" class="log">[ system boot ] WazOS unified generator online. Awaiting generation request.</div>
        </div>

        <div class="tab-content" data-tab="meta">
          <div class="panel-box">
            <div class="field">
              <label>Prompt assembly</label>
              <div id="prompt-assembly" class="output-box"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const state = {
      mode: 'biped',
      seed: 0,
      lastPrompt: ''
    };

    const templates = {
      biped: [
        'heroic pose',
        'balanced anatomy',
        'clean silhouette',
        'high detail',
        'neon mechanical accents'
      ],
      lattice: [
        'fractured geometric structure',
        'linked joints',
        'wireframe anatomy',
        'symmetry engine',
        'energy lattice'
      ],
      portrait: [
        'front-facing portrait',
        'sharp facial features',
        'cinematic rim light',
        'stylized expressive eyes',
        'detailed skin and costume'
      ],
      robot: [
        'chrome plating',
        'industrial materials',
        'precision joints',
        'technical plating',
        'narrow beam lighting'
      ]
    };

    function logLine(text) {
      const box = document.getElementById('log');
      if (!box) return;
      const line = document.createElement('div');
      line.textContent = text;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function assemblePrompt() {
      const subject = document.getElementById('subject').value.trim() || 'biomechanical creature';
      const style = document.getElementById('style').value.trim() || 'high detail';
      const negative = document.getElementById('negative').value.trim();
      const mode = document.getElementById('mode').value || state.mode;
      const extras = templates[mode] || templates.biped;
      const addOn = pickRandom(extras);
      const prompt = `${subject}, ${style}, ${addOn}, ${mode} rig architecture, anatomy shield active, clean composition, dramatic lighting`;
      state.mode = mode;
      state.lastPrompt = prompt;
      return { prompt, negative };
    }

    function setStatus(text, loading = false) {
      const statusText = document.getElementById('status-text');
      const statusPill = document.getElementById('status-pill');
      if (statusText) statusText.textContent = text;
      if (statusPill) {
        statusPill.textContent = loading ? 'Generating...' : 'Pipeline: online';
        statusPill.classList.toggle('loading', loading);
      }
    }

    function updateMetrics() {
      const mode = document.getElementById('mode').value || state.mode;
      document.getElementById('metric-rig').textContent = mode;
      document.getElementById('metric-anatomy').textContent = mode === 'lattice' ? 'balanced' : 'stable';
      document.getElementById('metric-seed').textContent = state.seed || '--';
    }

    function renderPrompt() {
      const { prompt, negative } = assemblePrompt();
      const output = document.getElementById('final-prompt');
      if (output) output.textContent = prompt;

      const assembly = document.getElementById('prompt-assembly');
      if (assembly) {
        assembly.textContent = `Prompt: ${prompt}\n\nNegative: ${negative}`;
      }
    }

    function generateImage() {
      const mode = document.getElementById('mode').value || 'biped';
      const { prompt, negative } = assemblePrompt();
      const size = document.getElementById('size').value || '768x768';
      const [w, h] = size.split('x');
      state.seed = Math.floor(Math.random() * 900000) + 100000;
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&seed=${state.seed}&model=flux&nologo=true&negative_prompt=${encodeURIComponent(negative)}`;

      const preview = document.getElementById('preview');
      if (preview) {
        preview.src = url;
        preview.alt = prompt;
      }

      setStatus('Generating', true);
      logLine(`[${new Date().toLocaleTimeString()}] ${mode.toUpperCase()} rig -> seed ${state.seed}`);
      logLine(`[${new Date().toLocaleTimeString()}] prompt assembled: ${prompt}`);

      setTimeout(() => {
        setStatus('Ready');
        updateMetrics();
      }, 1100);

      if (document.getElementById('final-prompt')) {
        document.getElementById('final-prompt').textContent = prompt;
      }
      if (document.getElementById('prompt-assembly')) {
        document.getElementById('prompt-assembly').textContent = `Prompt: ${prompt}\n\nNegative: ${negative}`;
      }
    }

    function setMode(mode) {
      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      const modeSelect = document.getElementById('mode');
      if (modeSelect) modeSelect.value = mode;
      state.mode = mode;
      renderPrompt();
      updateMetrics();
    }

    function bindTabs() {
      document.querySelectorAll('.tab').forEach((button) => {
        button.addEventListener('click', () => {
          const tab = button.dataset.tab;
          document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('active', el === button));
          document.querySelectorAll('.tab-content').forEach((panel) => {
            panel.classList.toggle('active', panel.dataset.tab === tab);
          });
        });
      });
    }

    document.getElementById('generate').addEventListener('click', generateImage);
    document.getElementById('surprise').addEventListener('click', () => {
      const modes = Object.keys(templates);
      const randomMode = modes[Math.floor(Math.random() * modes.length)];
      const templatePool = templates[randomMode];
      const subjectPool = [
        'cybernetic fox',
        'chrome guardian',
        'ancient warrior',
        'harbor sentinel',
        'bio-mechanical idol',
        'astral botanist',
        'synthwave rider',
        'lunar monk'
      ];
      document.getElementById('mode').value = randomMode;
      document.getElementById('subject').value = `${pickRandom(subjectPool)} with ${pickRandom(templatePool)}`;
      document.getElementById('style').value = 'ultra detailed, dramatic lighting, clean silhouette, vibrant color contrast';
      generateImage();
    });

    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const value = chip.dataset.template;
        document.getElementById('subject').value = value;
        renderPrompt();
      });
    });

    document.getElementById('mode').addEventListener('change', () => {
      state.mode = document.getElementById('mode').value;
      renderPrompt();
      updateMetrics();
    });

    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    bindTabs();
    renderPrompt();
    updateMetrics();
    logLine('[ system boot ] WazOS unified generator initialized.');
    logLine('[ layout ] biomechanical UI ready.');
    logLine('[ pipeline ] Pollinations generation link active.');
  </script>
</body>
</html>
