<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WazOs - VST-Biomechanik-Engine</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg: #050c05;
            --panel: #0b140d;
            --panel-2: #101e12;
            --line: #1b6a3d;
            --text: #b8ffbf;
            --muted: #86d79a;
            --accent: #43ff8a;
            --warning: #ffcb6b;
            --shadow: rgba(67, 255, 138, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: monospace;
            min-height: 100vh;
        }

        #app-shell {
            display: grid;
            grid-template-rows: auto auto 1fr;
            min-height: 100vh;
            padding: 18px;
            gap: 14px;
        }

        .topbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border: 1px solid var(--line);
            background: rgba(11,20,13,0.95);
            box-shadow: 0 0 18px var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand .dot {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-btn, button {
            background: #111;
            color: var(--text);
            border: 1px solid var(--line);
            padding: 9px 12px;
            cursor: pointer;
            transition: 0.14s ease;
        }

        .mode-btn:hover, button:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(67,255,138,0.22);
        }

        .mode-btn.active {
            background: rgba(67,255,138,0.14);
            color: #dfffe9;
            border-color: var(--accent);
        }

        .workspace {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 14px;
            min-height: 0;
        }

        .sidebar, .main-panel {
            border: 1px solid var(--line);
            background: rgba(11,20,13,0.95);
            box-shadow: 0 0 18px var(--shadow);
            padding: 14px;
        }

        .mode-panel {
            display: none;
            gap: 14px;
            flex-direction: column;
        }

        .mode-panel.active {
            display: flex;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        input, textarea, select {
            width: 100%;
            background: #071108;
            border: 1px solid var(--line);
            color: var(--text);
            padding: 10px 11px;
            font: inherit;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .idea-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .idea-chip {
            cursor: pointer;
            border: 1px solid var(--line);
            background: rgba(67,255,138,0.05);
            color: var(--text);
            padding: 8px 10px;
            font-size: 12px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preview-box {
            border: 1px solid var(--line);
            background: #050b06;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-box img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: linear-gradient(135deg, #071108, #0d1f0f);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--line);
            padding-top: 10px;
        }

        .status-pill {
            border: 1px solid var(--line);
            padding: 4px 8px;
            background: rgba(67,255,138,0.06);
            color: var(--text);
        }

        .status-pill.loading {
            border-color: var(--warning);
            color: var(--warning);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
        }

        .tab-btn.active {
            background: rgba(67,255,138,0.12);
            border-color: var(--accent);
            color: var(--text);
        }

        .tab-content {
            display: none;
            gap: 12px;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        #log-container {
            height: 140px;
            overflow-y: auto;
            border: 1px solid var(--line);
            background: #040c05;
            padding: 8px;
            color: var(--muted);
        }

        #waz-svg-canvas {
            width: 100%;
            height: 220px;
            border: 1px solid var(--line);
            background: #040b05;
            display: block;
        }

        .tiny {
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div id="app-shell">
        <header class="topbar">
            <div class="brand">
                <span class="dot"></span>
                <span>WazOs // Biomechanical Core</span>
            </div>
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="beginner">Beginner</button>
                <button class="mode-btn" data-mode="control">Control</button>
                <button class="mode-btn" data-mode="advanced">Advanced</button>
            </div>
        </header>

        <section class="workspace">
            <aside class="sidebar">
                <div class="mode-panel active" data-mode="beginner">
                    <div class="form-row">
                        <label for="prompt-beginner">Prompt</label>
                        <textarea id="prompt-beginner" data-sync-prompt> A cybernetic skull with neon green tubes, highly detailed, cinematic lighting </textarea>
                    </div>
                    <div class="idea-row">
                        <button class="idea-chip" data-idea="A cybernetic skull with neon green tubes, highly detailed, cinematic lighting">Cyber skull</button>
                        <button class="idea-chip" data-idea="A biomechanical fox with glowing joints, anime style, heroic pose">Biomech fox</button>
                        <button class="idea-chip" data-idea="A steampunk robot with brass gears, dark studio lighting, intricate details">Steampunk bot</button>
                    </div>
                    <div class="button-row">
                        <button data-generate>Generate</button>
                        <button id="show-more-controls">More controls</button>
                    </div>
                    <div class="preview-box">
                        <img id="render-image" alt="Preview render" src="" />
                    </div>
                    <div class="status-bar">
                        <span class="tiny">Mode: <strong id="mode-status">beginner</strong></span>
                        <span id="generation-status" class="status-pill ready">Ready</span>
                    </div>
                </div>

                <div class="mode-panel" data-mode="control">
                    <div class="form-row">
                        <label for="prompt-control">Prompt</label>
                        <textarea id="prompt-control" data-sync-prompt> A biomechanical fox with glowing joints, anime style, heroic pose </textarea>
                    </div>
                    <div class="form-row">
                        <label for="style-control">Style</label>
                        <input id="style-control" data-sync-prompt value="cyberpunk style, neon colors" />
                    </div>
                    <div class="form-row">
                        <label for="negative-control">Negative</label>
                        <input id="negative-control" data-sync-prompt value="blurry, low quality, watermark, text, distorted" />
                    </div>
                    <div class="form-row">
                        <label for="resolution-control">Resolution</label>
                        <select id="resolution-control" data-sync-prompt>
                            <option value="512x512">512x512</option>
                            <option value="768x768" selected>768x768</option>
                            <option value="1024x1024">1024x1024</option>
                            <option value="1024x768">1024x768</option>
                        </select>
                    </div>
                    <div class="button-row">
                        <button data-generate>Generate</button>
                        <button id="control-status" class="status-pill ready">Ready</button>
                    </div>
                    <div class="preview-box">
                        <img id="render-image-control" alt="Control preview" src="" />
                    </div>
                </div>

                <div class="mode-panel" data-mode="advanced">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="studio">Studio</button>
                        <button class="tab-btn" data-tab="history">History</button>
                        <button class="tab-btn" data-tab="render">Render</button>
                    </div>

                    <div class="tab-content active" data-tab="studio">
                        <div class="form-row">
                            <label for="prompt-advanced">Prompt</label>
                            <textarea id="prompt-advanced" data-sync-prompt> A biomechanical humanoid sculpted from obsidian and chrome, impossible anatomy, dramatic lighting </textarea>
                        </div>
                        <div class="form-row">
                            <label for="style-advanced">Style</label>
                            <input id="style-advanced" data-sync-prompt value="cinematic industrial biomechanical, subtle volumetric light, ultra detailed" />
                        </div>
                        <div class="form-row">
                            <label for="negative-advanced">Negative</label>
                            <input id="negative-advanced" data-sync-prompt value="blurry, low quality, watermark, text, noisy background, deformed hands" />
                        </div>
                        <div class="form-row">
                            <label for="batch-advanced">Batch</label>
                            <input id="batch-advanced" data-sync-prompt type="number" min="1" max="8" value="1" />
                        </div>
                        <div class="form-row">
                            <label for="resolution-advanced">Resolution</label>
                            <select id="resolution-advanced" data-sync-prompt>
                                <option value="512x512">512x512</option>
                                <option value="768x768" selected>768x768</option>
                                <option value="1024x1024">1024x1024</option>
                                <option value="1536x1024">1536x1024</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label for="zoom-control">Zoom</label>
                            <input id="zoom-control" data-sync-prompt type="range" min="50" max="200" value="100" />
                        </div>
                        <div class="button-row">
                            <button data-generate>Generate</button>
                            <button id="advanced-status" class="status-pill ready">Ready</button>
                        </div>
                    </div>

                    <div class="tab-content" data-tab="history">
                        <div id="log-container">[ system boot ] WazOs core ready. waiting for generation request.</div>
                    </div>

                    <div class="tab-content" data-tab="render">
                        <div class="preview-box">
                            <img id="render-image-advanced" alt="Advanced preview" src="" />
                        </div>
                        <div class="status-bar">
                            <span class="tiny" id="render-meta">@ 768x768</span>
                            <span class="status-pill ready">Pipeline: online</span>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="main-panel">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="studio">Live Nodegraph</button>
                    <button class="tab-btn" data-tab="history">Execution Log</button>
                    <button class="tab-btn" data-tab="render">Output</button>
                </div>

                <div class="tab-content active" data-tab="studio">
                    <svg id="waz-svg-canvas"></svg>
                    <div class="button-row">
                        <button onclick="window.WazgManager.dispatch('ADD_NODE', {x: Math.random()*500, y: Math.random()*300}, event)">ADD JOINT</button>
                        <button onclick="window.WazgManager.dispatch('CLEAR_WORKSPACE', null, event)">CLEAR ALL</button>
                    </div>
                </div>

                <div class="tab-content" data-tab="history">
                    <div id="log-container-secondary">[ log ] WazOs nodegraph initialized. Connectors active.</div>
                </div>

                <div class="tab-content" data-tab="render">
                    <div class="preview-box">
                        <img id="render-image-main" alt="Main render panel" src="" />
                    </div>
                </div>
            </main>
        </section>
    </div>

    <script src="src/plugins/isg_997_WazLogger.js"></script>
    <script src="src/core/WazgManager.js"></script>
    <script src="src/core/WazgAnatomy.js"></script>
    <script src="src/core/WazgBridge.js"></script>
    <script src="src/ui/wazos-shell.js"></script>
    <script>
        window.onload = () => {
            try {
                if (window.WazgManager && typeof window.WazgManager.init === 'function') {
                    window.WazgManager.init();
                }
                if (window.WazgAnatomy && typeof window.WazgAnatomy.init === 'function') {
                    window.WazgAnatomy.init();
                }
                if (window.WazgBridge && typeof window.WazgBridge.init === 'function') {
                    window.WazgBridge.init();
                }
                console.log('System bereit.');
            } catch (e) {
                console.error('Start-Fehler:', e);
            }
        };
    </script>
</body>
</html>
