<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>wazOS v66.0 - BIOMECHANICAL OS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    * { box-sizing: border-box; }
    body, html { margin:0; padding:0; width:100%; height:100%; background:#0a0a0a; font-family:'VT323', monospace; overflow:hidden; color:#00ff88; touch-action: manipulation; }
    
    #header { height:52px; background:#111; border-bottom:3px solid #00ff88; display:flex; align-items:center; padding:0 15px; justify-content:space-between; font-size:22px; box-shadow:0 0 15px #00ff88; }
    #workspace { height:calc(100vh - 260px); position:relative; background:#111; }
    #canvas { position:absolute; top:0; left:0; width:100%; height:100%; image-rendering: pixelated; }
    
    #control-panel { 
      position:absolute; top:10px; left:10px; z-index:300; background:rgba(15,20,18,0.96); 
      border:3px solid #00ff88; border-radius:8px; width:280px; padding:12px; max-height:65vh; overflow-y:auto;
    }
    .section { margin:14px 0; }
    .section-title { color:#00ffcc; font-size:16px; border-bottom:1px dashed #00cc66; padding-bottom:4px; }
    button, select, input { width:100%; padding:10px; margin:5px 0; background:#1a1a1a; border:2px solid #00cc66; color:#00ff88; font-family:inherit; font-size:15px; }
    button:active { background:#003300; transform:scale(0.97); }

    #timeline { 
      position:absolute; bottom:8px; left:8px; right:8px; height:82px; 
      background:rgba(20,20,20,0.95); border:3px solid #00ff88; border-radius:8px; 
      display:flex; align-items:center; padding:8px; gap:6px; overflow-x:auto; z-index:290;
    }
    .frame { 
      width:62px; height:62px; background:#222; border:2px solid #00cc66; 
      display:flex; align-items:center; justify-content:center; font-size:12px; 
      flex-shrink:0; cursor:grab; position:relative; overflow:hidden;
    }
    .frame.active { border-color:#ffff00; box-shadow:0 0 15px #ffff00; }
    .frame img { width:100%; height:100%; object-fit:cover; }

    #terminal { height:78px; background:#111; border-top:3px solid #00ff88; overflow-y:auto; padding:8px; font-size:12px; }
  </style>
</head>
<body>

  <div id="header">
    <div>wazOS v66.0</div>
    <div>BIOMECHANICAL ENGINE</div>
  </div>

  <div id="workspace">
    <svg id="canvas" width="100%" height="100%"></svg>
  </div>

  <!-- Control Panel -->
  <div id="control-panel">
    <div class="section">
      <div class="section-title">🧬 T2I GENERATION</div>
      <input type="text" id="prompt" value="cyber biomechanical warrior dynamic pose" placeholder="Prompt...">
      <button onclick="generateFrames()">GENERATE 8 FRAMES</button>
      <label><input type="checkbox" id="seedlock" checked> Seed Lock</label>
    </div>

    <div class="section">
      <div class="section-title">🦴 RIG & IK</div>
      <button onclick="createBipedRig()">DEPLOY BIPED RIG</button>
      <button onclick="solveIK()">SOLVE ARM IK</button>
      <button onclick="updateAllIK()">FULL IK UPDATE</button>
    </div>

    <div class="section">
      <div class="section-title">🎞️ TIMELINE</div>
      <button onclick="playInterpolated()">▶ INTERPOLATED PLAY</button>
      <button onclick="stopPlayback()">⏹ STOP</button>
      <select id="easing">
        <option value="linear">Linear</option>
        <option value="easeIn">Ease In</option>
        <option value="easeOut">Ease Out</option>
        <option value="easeInOut" selected>Ease In/Out</option>
      </select>
      <label><input type="checkbox" id="onionskin" checked> Onion Skin</label>
    </div>
  </div>

  <!-- Drag & Drop Timeline -->
  <div id="timeline" ondrop="drop(event)" ondragover="allowDrop(event)"></div>

  <div id="terminal">
    <div id="terminal-text"></div>
  </div>

  <script>
    const repoUser = "wazlavgottodowitz";
    const repoName = "WazOs";
    const branch = "main";
    let frameBuffer = [];
    let playbackInterval = null;

    function safeLog(type, msg) {
      const t = document.getElementById("terminal-text");
      const time = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
      t.innerHTML += `(${time}) <span style="color:#00cc88">(${type})</span> ${msg}<br>`;
      t.scrollTop = t.scrollHeight;
      if (t.children.length > 28) t.removeChild(t.children[0]);
    }

    async function injectModule(path) {
      try {
        const script = document.createElement('script');
        script.src = `https://cdn.jsdelivr.net/gh/${repoUser}/${repoName}@${branch}/${path}?t=${Math.floor(Date.now()/300000)}`;
        await new Promise((res, rej) => { script.onload = res; script.onerror = rej; document.head.appendChild(script); });
      } catch(e) {}
    }

    async function boot() {
      safeLog("SYSTEM", "wazOS v66.0 FULL BIOMECHANICAL ENGINE");
      const modules = [
        'src/core/WazgLogcat.js','src/core/WazgManager.js','src/core/WazgGuard.js','src/core/WazgAnatomy.js',
        'src/ui/WazgUI.js','src/ui/WazgTheme.js','src/ui/WazgAccessibility.js','src/ui/WazgPanZoom.js',
        'src/ui/WazgFrameThrower.js','src/ui/WazgPathMorph.js','src/ui/WazgBezierEditor.js',
        'src/ui/WazgDeCasteljauVisualizer.js','src/ui/WazgWebGL.js','src/ui/WazgGLTFLoader.js',
        'src/ui/WazgFABRIK.js','src/ui/WazgJointLimits.js','src/ui/WazgBipedRig.js',
        'src/ui/WazgProcedural.js','src/ui/WazgIKSystem.js','src/ui/WazgPoseLibrary.js',
        'src/ui/WazgIKSolver.js','src/ui/WazgLayout.js'
      ];

      for (const m of modules) await injectModule(m);
      safeLog("SYSTEM", "All modules connected. Ready for creation.");
    }

    function generateFrames() {
      const prompt = document.getElementById("prompt").value;
      if (window.WazgFrameThrower) {
        window.WazgFrameThrower.throwFrames(prompt, 8);
        setTimeout(renderTimeline, 1200);
      }
    }

    function renderTimeline() {
      const timeline = document.getElementById("timeline");
      timeline.innerHTML = "";
      frameBuffer = window.WazgFrameThrower?.frameBuffer || [];

      frameBuffer.forEach((frame, i) => {
        const el = document.createElement("div");
        el.className = "frame";
        el.draggable = true;
        el.dataset.index = i;
        el.innerHTML = `<img src="${frame.url}" style="width:100%;height:100%;object-fit:cover;">${i}`;
        el.ondragstart = e => e.dataTransfer.setData("text/plain", i);
        el.onclick = () => showFrame(i);
        timeline.appendChild(el);
      });
    }

    function allowDrop(e) { e.preventDefault(); }
    function drop(e) {
      e.preventDefault();
      const from = parseInt(e.dataTransfer.getData("text/plain"));
      const to = Array.from(e.currentTarget.children).indexOf(e.target.closest('.frame'));
      if (from === to) return;
      const moved = frameBuffer.splice(from, 1)[0];
      frameBuffer.splice(to, 0, moved);
      if (window.WazgFrameThrower) window.WazgFrameThrower.frameBuffer = frameBuffer;
      renderTimeline();
    }

    function showFrame(i) {
      const f = frameBuffer[i];
      if (f) document.getElementById("canvas").innerHTML = `<image href="${f.url}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"/>`;
    }

    function playInterpolated() {
      if (frameBuffer.length < 2) return;
      stopPlayback();
      let p = 0;
      const easing = document.getElementById("easing").value;

      playbackInterval = setInterval(() => {
        p += 0.018;
        const t = Math.min(p, 1);
        const eased = ease(t, easing);
        const idx = Math.floor(eased * (frameBuffer.length - 1));
        const blend = (eased * (frameBuffer.length - 1)) % 1;

        const a = frameBuffer[idx];
        const b = frameBuffer[Math.min(idx+1, frameBuffer.length-1)];

        if (a && b) {
          document.getElementById("canvas").innerHTML = `
            <image href="${a.url}" style="opacity:${1-blend};position:absolute;width:100%;height:100%" preserveAspectRatio="xMidYMid slice"/>
            <image href="${b.url}" style="opacity:${blend};position:absolute;width:100%;height:100%" preserveAspectRatio="xMidYMid slice"/>
          `;
        }
        if (p >= 1) p = 0;
      }, 16);
    }

    function ease(t, type) {
      if (type === "easeIn") return t*t;
      if (type === "easeOut") return 1-(1-t)*(1-t);
      if (type === "easeInOut") return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      return t;
    }

    function stopPlayback() {
      if (playbackInterval) clearInterval(playbackInterval);
    }

    function createBipedRig() { if (window.WazgIKSystem) window.WazgIKSystem.createBipedRig("player"); }
    function solveIK() { if (window.WazgIKSolver) window.WazgIKSolver.solve("LeftHand"); }
    function updateAllIK() { if (window.WazgIKSystem) window.WazgIKSystem.update(); }

    document.addEventListener("DOMContentLoaded", boot);
  </script>
</body>
  </html>
